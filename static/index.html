<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能客服工作台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="workspace">
    <aside class="rail" aria-label="主导航">
      <div class="rail-brand" aria-label="智能客服工作台">R</div>
      <button class="rail-item active" type="button" title="对话" aria-label="对话"><span class="rail-icon">⌂</span></button>
      <button class="rail-item" type="button" title="知识库" aria-label="知识库" id="railKnowledge"><span class="rail-icon">▤</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-item" type="button" title="设置" aria-label="设置" id="railSettings"><span class="rail-icon">⚙</span></button>
      <div class="rail-avatar">CS</div>
    </aside>

    <aside class="sidebar" aria-label="对话列表">
      <div class="sidebar-topline"><span>客服工作台</span><button class="collapse-button" type="button" title="收起侧边栏">‹</button></div>
      <div class="workspace-name"><div class="workspace-avatar">R</div><div><strong>RAG 客服助手</strong><span>本地工作区</span></div><span class="workspace-chevron">⌄</span></div>
      <button id="newConversation" class="new-conversation" type="button"><span class="plus-icon">＋</span><span>新建对话</span><span class="shortcut">Ctrl K</span></button>
      <div class="sidebar-search"><span>⌕</span><input id="conversationSearch" type="search" placeholder="搜索对话" autocomplete="off" /></div>
      <div class="conversation-heading"><span>最近对话</span><span id="conversationCount" class="conversation-count">0</span></div>
      <nav id="conversationList" class="conversation-list"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span>本地会话记录</span><button id="clearSearch" type="button" title="清除搜索">×</button></div>
    </aside>

    <section class="chat-panel">
      <header class="topbar">
        <div class="breadcrumb"><span class="breadcrumb-muted">对话</span><span class="breadcrumb-separator">/</span><strong id="conversationTitle">新对话</strong></div>
        <div class="topbar-actions">
          <span class="model-status"><span class="status-dot"></span>DeepSeek 在线</span>
          <button id="exportTxt" class="toolbar-button" type="button" title="导出 TXT">导出 TXT</button>
          <button id="exportJson" class="toolbar-button" type="button" title="导出 JSON">导出 JSON</button>
          <button id="openAdmin" class="toolbar-button icon-only" type="button" title="管理员知识库">⚙</button>
          <button id="renameConversation" class="toolbar-button icon-only" type="button" title="重命名当前对话">✎</button>
        </div>
      </header>

      <main id="messages" class="messages" aria-live="polite"></main>
      <footer class="input-wrap">
        <div class="input-box">
          <div class="input-tools"><span class="input-context">RAG 知识库</span><span class="input-hint">Enter 发送</span></div>
          <div class="input-row"><textarea id="input" rows="1" placeholder="向客服助手提问..." autocomplete="off"></textarea><button id="send" type="button" title="发送">↗</button></div>
        </div>
        <p class="disclaimer">回答基于当前知识库生成，请在重要场景下人工复核。</p>
      </footer>
    </section>
  </div>

  <dialog id="adminDialog" class="admin-dialog">
    <form method="dialog" class="admin-card" id="adminForm">
      <div class="modal-header"><div><h2>管理员知识库</h2><p>编辑后保存会自动重建向量索引。</p></div><button id="closeAdmin" class="modal-close" type="button">×</button></div>
      <label for="adminToken">管理员密钥</label>
      <input id="adminToken" type="password" placeholder="对应服务端 ADMIN_TOKEN" autocomplete="off" />
      <label for="knowledgeContent">知识库内容</label>
      <textarea id="knowledgeContent" rows="14" placeholder="不同主题之间用空行分隔"></textarea>
      <div id="adminMessage" class="admin-message"></div>
      <div class="modal-actions"><button id="loadKnowledge" class="secondary-button" type="button">读取知识库</button><button id="saveKnowledge" class="primary-button" type="button">保存并重建索引</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
